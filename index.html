
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xbox 360 C++ Online Compiler</title>
  <script src="https://cloudflare.com"></script>
  <style>
    :root { --bg: #0b0e11; --card: #151a21; --border: #262f3d; --xbox: #52b043; --text: #e6edf3; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: radial-gradient(circle at top, #162418 0%, var(--bg) 55%); color: var(--text); margin: 0; padding: 16px; min-height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .badge { background: var(--xbox); color: #000; font-weight: 800; font-size: 11px; padding: 4px 8px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
    select { width: 100%; padding: 10px 12px; background: #0d1117; color: #fff; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; margin-bottom: 10px; }
    .toolbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .key-btn { background: #212832; color: #7ee787; border: 1px solid #30363d; border-radius: 8px; padding: 6px 12px; font-family: monospace; font-size: 15px; font-weight: bold; flex-shrink: 0; }
    textarea { width: 100%; height: 320px; padding: 12px; background: #090c10; color: #85e89d; border: 1px solid var(--border); border-radius: 10px; font-family: monospace; font-size: 13px; line-height: 1.45; }
    .build-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #52b043, #2ea043); color: #fff; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; }
    .build-btn:disabled { background: #262f3d; color: #7d8590; }
    #status { margin-top: 12px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-align: center; font-size: 14px; }
    #logBox { display: none; margin-top: 10px; padding: 12px; background: #1c1012; border: 1px solid #f85149; color: #ffa198; font-family: monospace; font-size: 12px; white-space: pre-wrap; border-radius: 8px; max-height: 200px; overflow-y: auto; }
    .dl-btn { display: inline-block; margin-top: 8px; padding: 12px 20px; background: #1f6feb; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>X360 C++ Studio</h1>
    <span class="badge">LIBXENON ELF</span>
  </div>

  <div class="card">
    <select id="templateSelect" onchange="loadTemplate()">
      <option value="menu">Template: Styled Xbox D-Pad Menu</option>
      <option value="controller">Template: Controller Tester</option>
      <option value="usb">Template: USB File Writer</option>
    </select>

    <div class="toolbar">
      <button type="button" class="key-btn" onclick="insertSym('{')">{</button>
      <button type="button" class="key-btn" onclick="insertSym('}')">}</button>
      <button type="button" class="key-btn" onclick="insertSym(';')">;</button>
      <button type="button" class="key-btn" onclick="insertSym('()')">()</button>
      <button type="button" class="key-btn" onclick="insertSym('#include <>')">#inc</button>
      <button type="button" class="key-btn" onclick="insertSym('printf(&quot;\\n&quot;);')">printf</button>
    </div>

    <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
  </div>

  <button class="build-btn" id="buildBtn" onclick="compileCode()">Compile & Download xenon.elf</button>
  <div id="status">Write C++ above and tap Compile.</div>
  <pre id="logBox"></pre>

  <script>
    // === YOUR BACKEND CONFIG ===
    const REPO = "YOUR_USERNAME/YOUR_REPO";
    const TOKEN = "YOUR_FINE_GRAINED_TOKEN";
    // ===========================

    const templates = {
      menu: `#include <cstdio>
#include <input/input.h>
#include <xenos/xenos.h>
#include <console/console.h>
#include <usb/usbmain.h>

void drawMenu(int selected) {
    printf("\\033[2J\\033[H");
    printf("\\033[42;30m   XBOX 360 HOMEBREW MENU   \\033[0m\\n\\n");
    const char* items[3] = {"Run Payload", "System Check", "Exit to XeLL"};
    for (int i = 0; i < 3; i++) {
        if (i == selected) printf("\\033[32m > %s\\033[0m\\n", items[i]);
        else printf("   %s\\n", items[i]);
    }
    printf("\\nUse D-Pad Up/Down and press A.\\n");
}

int main() {
    xenos_init(); console_init(); kmem_init(); usb_init(); usb_do_poll();
    int sel = 0;
    drawMenu(sel);

    struct controller_data_s oldc = {0};
    while (true) {
        struct controller_data_s c;
        if (get_controller_data(&c, 0)) {
            if (c.down && !oldc.down) { sel = (sel + 1) % 3; drawMenu(sel); }
            if (c.up && !oldc.up) { sel = (sel + 2) % 3; drawMenu(sel); }
            if (c.a && !oldc.a) {
                if (sel == 2) return 0;
                printf("\\n\\033[36mSelected option %d!\\033[0m\\n", sel + 1);
            }
            oldc = c;
        }
        usb_do_poll();
    }
    return 0;
}`,
      controller: `#include <cstdio>
#include <input/input.h>
#include <xenos/xenos.h>
#include <console/console.h>
#include <usb/usbmain.h>

int main() {
    xenos_init(); console_init(); kmem_init(); usb_init(); usb_do_poll();
    printf("Press A, B, X, Y on your controller...\\n");
    struct controller_data_s oldc = {0};
    while (true) {
        struct controller_data_s c;
        if (get_controller_data(&c, 0)) {
            if (c.a && !oldc.a) printf("[A] Pressed\\n");
            if (c.b && !oldc.b) printf("[B] Pressed\\n");
            if (c.x && !oldc.x) printf("[X] Pressed\\n");
            if (c.y && !oldc.y) printf("[Y] Pressed\\n");
            oldc = c;
        }
        usb_do_poll();
    }
    return 0;
}`,
      usb: `#include <cstdio>
#include <xenos/xenos.h>
#include <console/console.h>
#include <usb/usbmain.h>
#include <diskio/ata.h>

int main() {
    xenos_init(); console_init(); kmem_init(); usb_init(); usb_do_poll();
    FILE *f = fopen("uda0:/xbox_output.txt", "w");
    if (f) {
        fprintf(f, "Hello from Xbox 360 Homebrew!\\n");
        fclose(f);
        printf("Saved uda0:/xbox_output.txt!\\n");
    } else {
        printf("USB drive not found.\\n");
    }
    while (true) { usb_do_poll(); }
    return 0;
}`
    };

    const codeEl = document.getElementById('code');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('logBox');
    const btn = document.getElementById('buildBtn');
    codeEl.value = templates.menu;

    function loadTemplate() {
      codeEl.value = templates[document.getElementById('templateSelect').value];
    }

    function insertSym(sym) {
      const start = codeEl.selectionStart;
      codeEl.value = codeEl.value.substring(0, start) + sym + codeEl.value.substring(codeEl.selectionEnd);
      codeEl.selectionStart = codeEl.selectionEnd = start + sym.length;
      codeEl.focus();
    }

    async function compileCode() {
      btn.disabled = true;
      logEl.style.display = 'none';
      const headers = {
        'Authorization': `Bearer ${TOKEN}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      try {
        statusEl.textContent = '1/3 Sending C++ code to cloud compiler...';
        const fileUrl = `https://github.com{REPO}/contents/source/main.cpp`;
        const getRes = await fetch(fileUrl, { headers });
        const fileData = getRes.ok ? await getRes.json() : {};

        const pushRes = await fetch(fileUrl, {
          method: 'PUT',
          headers,
          body: JSON.stringify({
            message: 'Web build',
            content: btoa(unescape(encodeURIComponent(codeEl.value))),
            sha: fileData.sha
          })
        });
        if (!pushRes.ok) throw new Error('Server busy or invalid token. Try again in a moment.');

        const pushJson = await pushRes.json();
        const commitSha = pushJson.commit.sha;

        statusEl.textContent = '2/3 Compiling xenon.elf (~25 seconds)...';
        let run;
        for (let i = 0; i < 25; i++) {
          await new Promise(r => setTimeout(r, 3500));
          const runsRes = await fetch(`https://github.com{REPO}/actions/runs?head_sha=${commitSha}`, { headers });
          const runsData = await runsRes.json();
          run = runsData.workflow_runs && runsData.workflow_runs[0];
          if (run && run.status === 'completed') break;
        }

        if (!run) throw new Error('Build timed out.');

        statusEl.textContent = '3/3 Preparing download...';
        const artRes = await fetch(run.artifacts_url, { headers });
        const artData = await artRes.json();

        if (run.conclusion !== 'success') {
          const logArt = artData.artifacts.find(a => a.name === 'build-log');
          if (logArt) {
            const logZipRes = await fetch(logArt.archive_download_url, { headers });
            const zip = await JSZip.loadAsync(await logZipRes.blob());
            logEl.textContent = await zip.file('build.log').async('string');
            logEl.style.display = 'block';
          }
          throw new Error('C++ Error! Fix the issue shown below:');
        }

        const elfArt = artData.artifacts.find(a => a.name === 'xenon-elf');
        const elfZipRes = await fetch(elfArt.archive_download_url, { headers });
        const elfZip = await JSZip.loadAsync(await elfZipRes.blob());
        const elfBlob = await elfZip.file('xenon.elf').async('blob');
        const downloadUrl = URL.createObjectURL(elfBlob);

        statusEl.innerHTML = `✅ Build Ready!<br><a class="dl-btn" href="${downloadUrl}" download="xenon.elf">Download xenon.elf</a>`;
      } catch (err) {
